# Publish flutter_alacritty to pub.dev when a version tag is pushed.
# OIDC trust must be configured on pub.dev (Admin → Automated publishing).
# See PUBLISHING.md for one-time setup and rust_lib publish order.

name: Publish to pub.dev

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish flutter_alacritty
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for pub.dev OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      - uses: flutter-actions/setup-flutter@18c66a64fb6f6d3338c63cabbc5cd6da395e7f1d

      - name: Verify rust_lib_flutter_alacritty is on pub.dev
        run: |
          set -euo pipefail
          rust_lib_version=$(
            python3 -c "
          import re, pathlib
          text = pathlib.Path('pubspec.yaml').read_text()
          m = re.search(
              r'^\\s*rust_lib_flutter_alacritty:\\s*\\^?([0-9]+\\.[0-9]+\\.[0-9]+)',
              text,
              re.M,
          )
          if not m:
              raise SystemExit('rust_lib_flutter_alacritty version not found in pubspec.yaml')
          print(m.group(1))
          "
          )
          echo "Expecting rust_lib_flutter_alacritty ${rust_lib_version} on pub.dev"
          if ! curl -fsS "https://pub.dev/api/packages/rust_lib_flutter_alacritty/versions/${rust_lib_version}" >/dev/null; then
            echo "ERROR: rust_lib_flutter_alacritty ${rust_lib_version} is not on pub.dev yet."
            echo "Publish and tag rust_lib_flutter_alacritty first, then re-push this tag."
            exit 1
          fi

      - name: Verify flutter_pty_new is on pub.dev
        run: |
          set -euo pipefail
          flutter_pty_new_version=$(
            python3 -c "
          import re, pathlib
          text = pathlib.Path('pubspec.yaml').read_text()
          m = re.search(
              r'^\\s*flutter_pty_new:\\s*\\^?([0-9]+\\.[0-9]+\\.[0-9]+)',
              text,
              re.M,
          )
          if not m:
              raise SystemExit('flutter_pty_new version not found in pubspec.yaml')
          print(m.group(1))
          "
          )
          echo "Expecting flutter_pty_new ${flutter_pty_new_version} on pub.dev"
          if ! curl -fsS "https://pub.dev/api/packages/flutter_pty_new/versions/${flutter_pty_new_version}" >/dev/null; then
            echo "ERROR: flutter_pty_new ${flutter_pty_new_version} is not on pub.dev yet."
            echo "Publish and tag flutter_pty_new first, then re-push this tag."
            exit 1
          fi

      - name: Remove local pubspec_overrides for pub.dev
        run: rm -f pubspec_overrides.yaml

      - name: Install dependencies
        run: dart pub get

      - name: Publish - dry run
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        run: dart pub publish -f
